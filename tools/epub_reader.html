<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>brofessor EPUB reader QA</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px system-ui, sans-serif; background: #eef0f3; color: #18202a; }
  header { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; align-items: center; }
  label { display: flex; align-items: center; gap: 5px; max-width: 100%; }
  select, input, button { font: inherit; padding: 5px; max-width: 100%; }
  select { max-width: 270px; }
  #status { margin: 0 10px 8px; overflow-wrap: anywhere; }
  #viewer { height: calc(100dvh - 165px); min-height: 300px; background: white; margin: 0 10px; }
  #results { max-height: 110px; overflow: auto; padding: 0 10px; }
  #results button { display: block; margin-bottom: 4px; text-align: left; }
  @media(max-width: 500px) { #viewer { height: calc(100dvh - 235px); } select { max-width: 160px; } }
</style>
<header>
  <strong id="title">Loading EPUB…</strong>
  <button id="previous">Previous</button><button id="next">Next</button>
  <label>Contents <select id="toc" aria-label="Contents"></select></label>
  <label>Section <select id="spine" aria-label="Section"></select></label>
  <label>Position <input id="position" type="number" min="0" max="100" value="0" style="width:65px">%</label>
  <button id="go">Go</button>
  <label>Reader width <select id="width"><option value="">Automatic</option><option value="390px">390 px</option></select></label>
  <form id="search"><label>Find <input id="query" size="16"></label><button>Search</button></form>
</header>
<p id="status" role="status">Opening archive</p>
<div id="viewer"></div><div id="results"></div>
<!-- QA only: copy this page beside these pinned, locally downloaded builds. -->
<script src="jszip-3.10.1.min.js"></script><script src="epub-0.3.88.min.js"></script>
<script>
  const element = id => document.getElementById(id);
  const status = message => { element('status').textContent = message; };
  const url = new URLSearchParams(location.search).get('epub');
  const book = ePub(url);
  const rendition = book.renderTo('viewer', {width:'100%', height:'100%', spread:'none', allowScriptedContent:false});
  rendition.on('relocated', loc => {
    element('position').value = Math.round((loc.start.percentage || 0) * 100);
    status(`Reading ${loc.start.href}; page ${loc.start.displayed.page}/${loc.start.displayed.total}; ${loc.start.cfi}`);
  });
  rendition.on('displayError', error => status('Reader error: ' + error.message));
  book.loaded.metadata.then(metadata => { element('title').textContent = metadata.title; });
  book.loaded.navigation.then(navigation => {
    function options(items, depth=0) {
      for (const item of items) {
        element('toc').add(new Option('  '.repeat(depth) + item.label.trim(), item.href));
        options(item.subitems || [], depth+1);
      }
    }
    options(navigation.toc);
  });
  book.ready.then(async () => {
    book.spine.spineItems.forEach((item, i) => element('spine').add(new Option(`${i+1}: ${item.href}`, item.href)));
    await rendition.display();
    await book.locations.generate(1000);
    element('go').disabled = false;
  }).catch(error => status('Reader error: ' + error.message));
  element('go').disabled = true;
  element('previous').onclick = () => rendition.prev();
  element('next').onclick = () => rendition.next();
  element('toc').onchange = event => rendition.display(event.target.value);
  element('spine').onchange = event => rendition.display(event.target.value);
  element('go').onclick = () => rendition.display(book.locations.cfiFromPercentage(Number(element('position').value)/100));
  element('width').onchange = event => {
    document.body.style.maxWidth = event.target.value;
    rendition.resize();
  };
  element('search').onsubmit = async event => {
    event.preventDefault();
    const target = element('results'); target.replaceChildren();
    const query = element('query').value;
    if (!query.trim()) return;
    for (const section of book.spine.spineItems) {
      await section.load(book.load.bind(book));
      for (const found of section.find(query)) {
        const button = document.createElement('button'); button.textContent = found.excerpt;
        button.onclick = () => { rendition.display(found.cfi); target.replaceChildren(); };
        target.append(button);
      }
      section.unload();
    }
    if (!target.childNodes.length) target.textContent = 'No matches';
  };
</script>
</html>
