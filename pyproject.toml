[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brofessor"
version = "0.1.0"
description = "Local sources, grounded answers, podcasts and presentations"
requires-python = ">=3.12,<3.14"
dependencies = ["typer>=0.15,<1", "pydantic>=2.10,<3", "pypdf>=5,<7", "httpx>=0.28,<1", "python-pptx>=1.0.2,<2"]

[project.optional-dependencies]
ui = ["streamlit>=1.45,<2"]
speech = ["mlx-audio>=0.6.3,<0.7", "soundfile>=0.13,<1", "imageio-ffmpeg>=0.6,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
brofessor = "brofessor.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel]
packages = ["src/brofessor"]
